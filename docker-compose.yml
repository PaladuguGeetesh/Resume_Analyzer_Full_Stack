services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./Backend
    env_file:
      - ./Backend/.env
    environment:
      # container-network hostnames, not localhost — this is what makes api/worker
      # reach the mongo/redis *services* instead of (nonexistent) processes on
      # their own container's loopback interface
      MONGO_URI: mongodb://mongo:27017/resume_analyzer
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-reports:
    build:
      context: ./Backend
    command: node worker-reports-standalone.js
    env_file:
      - ./Backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/resume_analyzer
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker-resumes:
    build:
      context: ./Backend
    command: node worker-resumes-standalone.js
    env_file:
      - ./Backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/resume_analyzer
      REDIS_URL: redis://redis:6379
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  redis-data:
  mongo-data:
