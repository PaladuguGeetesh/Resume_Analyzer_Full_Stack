server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router uses client-side routing — any path nginx doesn't recognize
    # as a real file must still fall back to index.html so the app's own router
    # can handle it, instead of nginx returning a 404 for e.g. a page refresh on /login
    location / {
        try_files $uri $uri/ /index.html;
    }
}
